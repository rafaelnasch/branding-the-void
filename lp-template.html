.procedencia{margin-top:var(--e-5);padding:6px 10px;border-left:2px dashed var(--atencao);font:400 13px/1.45 var(--font-texto);color:var(--po);max-width:var(--coluna-leitura)}
.procedencia b{font-weight:600;color:var(--cal)}
.modo-leitura .procedencia{color:var(--ardosia)}.modo-leitura .procedencia b{color:var(--sala)}

/* textos */
.cred{font:500 var(--fs-credito)/1.35 var(--font-letreiro);font-variation-settings:"wdth" var(--wdth-credito);text-transform:uppercase;letter-spacing:var(--ls-credito);color:var(--po);margin:0}
.marc{display:flex;align-items:center;gap:10px;margin:0 0 var(--e-5)}
.marc-ic{display:inline-flex;width:14px;height:14px;flex:none}
.h-filme{margin:0;font:800 clamp(44px,6.6vw,var(--fs-filme))/.92 var(--font-letreiro);font-variation-settings:"wdth" 112;text-transform:uppercase;letter-spacing:var(--ls-filme);color:var(--tela);text-wrap:balance;hyphens:manual;overflow-wrap:normal;word-break:normal}
.h-secao{margin:0;font:700 clamp(34px,4.4vw,var(--fs-secao))/.98 var(--font-letreiro);font-variation-settings:"wdth" 100;text-transform:uppercase;letter-spacing:var(--ls-secao);color:var(--tela);text-wrap:balance;hyphens:manual;overflow-wrap:normal}
.h-filme .off,.h-secao .off{font-size:1.2em;line-height:.8;color:var(--estacao-destaque)}
.modo-leitura .h-secao{color:var(--sala)}
.modo-leitura .h-secao .off{color:var(--sala)}
.fala{margin:0;font:600 var(--fs-inter)/1.25 var(--font-letreiro);font-variation-settings:"wdth" 100;letter-spacing:-.005em;color:var(--tela)}
.chamada{margin:0;font:400 var(--fs-chamada)/1.5 var(--font-texto);color:var(--cal)}
.corpo{margin:0;font:400 var(--fs-corpo)/var(--lh-corpo) var(--font-texto);color:var(--cal);hyphens:manual}
@media (max-width:430px){.corpo,.apoio{hyphens:auto}}
.apoio{margin:0;font:400 var(--fs-apoio)/var(--lh-apoio) var(--font-texto);color:var(--po)}
.legenda{margin:0;font:400 var(--fs-legenda)/1.45 var(--font-texto);color:var(--po)}
.modo-leitura .corpo,.modo-leitura .chamada{color:var(--sala)}
.modo-leitura .apoio{color:var(--ardosia)}
.modo-leitura .legenda,.modo-leitura .cred{color:var(--penumbra)}
.voz-off{margin:0;font:300 italic 30px/1.15 var(--font-off);font-variation-settings:"opsz" 72;color:var(--estacao-destaque)}
@media (max-width:640px){.chamada{font-size:19px}.fala{font-size:20px}}

/* seções */
.sec{position:relative;padding:var(--sec) 0}
.sec.cartela{padding:var(--cartela) 0}
.sec + .sec.borda{border-top:1px solid var(--fio)}
.bastidor{background:var(--bastidor)}
.sec-head{display:grid;gap:var(--e-5);margin-bottom:var(--e-8);max-width:860px}
.sec-head .apoio-sec{max-width:var(--coluna-leitura)}
.fonte{margin-top:var(--e-6)}
@media (max-width:640px){.sec-head{margin-bottom:var(--e-7)}}

/* botão (tokens.css define .botao; aqui só o encaixe) */
.botao{text-align:center;line-height:1.15;padding:12px 28px}
.botao .ic{width:20px;height:20px;stroke:var(--estacao-seta);stroke-width:2}
.botao:focus-visible{outline:2px solid var(--areia);outline-offset:3px}
.modo-leitura .botao:focus-visible{outline-color:var(--sala)}
.modo-leitura a.botao{text-decoration:none;color:var(--tela)}
.cta{display:grid;gap:var(--e-3);justify-items:start}
.cta .micro{margin:0;font:400 var(--fs-apoio)/1.45 var(--font-texto);color:var(--po);max-width:540px}
.modo-leitura .cta .micro{color:var(--ardosia)}
@media (max-width:430px){.cta{justify-items:stretch}}

/* LP01 · Barra de Turma */
.barra-turma{min-height:40px;display:flex;align-items:center;background:var(--bastidor);border-bottom:1px solid var(--estacao-grafismo)}
.barra-turma .wrap{display:flex;align-items:center;gap:12px;width:100%;padding-top:8px;padding-bottom:8px}
.barra-turma .ic{width:16px;height:16px;color:var(--estacao-destaque)}
.barra-turma .cred{color:var(--cal)}
.barra-turma b{color:var(--tela);font-weight:600}
@media (max-width:640px){.barra-turma{min-height:52px}}
@media (max-width:430px){.barra-turma .cred{letter-spacing:.1em;font-size:11.5px}}

/* LP02 · Cabeçalho Mínimo */
.topo{position:relative;z-index:3}
.topo .wrap{display:flex;align-items:center;justify-content:space-between;min-height:72px;gap:16px}
.topo img{height:28px;width:auto}
.coassina{display:flex;align-items:center}
.coassina img{height:28px}
.coassina .fio-v{width:1px;height:28px;background:var(--tela);margin:0 16px}
.coassina span{font:700 19px/1 var(--font-letreiro);font-variation-settings:"wdth" 112;letter-spacing:.02em;color:var(--tela)}
.ficha-tec{margin:0;text-align:right}
@media (max-width:640px){.topo .wrap{min-height:60px}.topo img,.coassina img{height:24px}.coassina .fio-v{height:24px;margin:0 10px}.coassina span{font-size:16px}.topo .ficha-tec{display:none}}

/* LP03 · Plano de Abertura */
.hero{position:relative;overflow:hidden;padding:var(--e-6) 0 var(--e-10)}
.hero-grade{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--e-8);align-items:stretch}
.hero-texto{display:flex;flex-direction:column;justify-content:center;gap:var(--e-5);padding:var(--e-8) 0 var(--e-6)}
.hero .h-filme{font-size:clamp(46px,6.4vw,var(--fs-filme))}
.hero-apoio{margin:0;font:400 var(--fs-chamada)/1.5 var(--font-texto);color:var(--cal);max-width:600px}
.hero .cta{margin-top:var(--e-3)}
/* linha de prova sob o botão: só com prova completa (6.16); marca de origem igual à da Régua de Prova */
.hero-prova{margin:var(--e-2) 0 0;padding:2px 0 2px 14px;border-left:2px solid var(--estacao-grafismo);font:400 15px/1.5 var(--font-texto);color:var(--cal);max-width:520px}
.hero-prova[data-origem="terceiro"]{border-left-style:dashed}
.hero-prova[data-origem="mercado"]{border-left-style:dotted}
.hero-prova b{margin-right:4px;font:700 24px/1 var(--font-letreiro);font-variation-settings:"wdth" 75;color:var(--tela);font-variant-numeric:lining-nums tabular-nums}
.hero-selo{position:absolute;top:-24px;right:-24px;width:200px;height:200px;z-index:3}
.hero-midia{position:relative;min-height:560px}
.hero-detalhes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 24px;margin:var(--e-2) 0 0;padding:0;list-style:none}
.hero-detalhes li{display:flex;gap:10px;align-items:flex-start;font:400 15px/1.45 var(--font-texto);color:var(--cal)}
.hero-detalhes .ic{width:20px;height:20px;color:var(--po);margin-top:1px}
.hero-detalhes b{display:block;font:500 12px/1.4 var(--font-letreiro);font-variation-settings:"wdth" 125;letter-spacing:.18em;text-transform:uppercase;color:var(--po)}
.hero.com-foto .hero-fundo{position:absolute;inset:0;z-index:0}
.hero.com-foto .hero-fundo img{width:100%;height:100%;object-fit:cover;filter:grayscale(1)}
.hero.com-foto .hero-fundo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgb(24 24 24 / .78) 0%,rgb(24 24 24 / .70) 42%,rgb(24 24 24 / 0) 72%)}
.hero > .wrap{position:relative;z-index:2}
@media (max-width:1024px){.hero-grade{grid-template-columns:minmax(0,1fr);gap:var(--e-6)}.hero-midia{min-height:0;aspect-ratio:16/10}.hero-selo{width:140px;height:140px}}
@media (max-width:640px){
  .hero{padding:var(--e-4) 0 var(--e-8)} /* sem altura de tela cheia: a Cartela do Vazio aparece na dobra e convida a rolar; o título não salta porque o pré-ajuste fixa largura e corpo antes da fonte chegar */
  .hero-texto{padding:0;gap:var(--e-4)}
  .hero .h-filme{font-size:48px;padding-right:0}
  .hero-apoio{font-size:17px;line-height:1.5}
  .hero .cta{margin-top:var(--e-2)}
  .hero-selo{display:none}
  .hero-midia{display:none} /* sem foto real, o celular não mostra o espaço reservado: a direção da foto está no computador e no painel */
  .hero-detalhes{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
  .hero-detalhes li{font-size:14px;min-height:42px}
}

/* espaço de foto rotulado (nunca banco nem IA: spec 8.1) */
.foto-slot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;height:100%;min-height:inherit;background:var(--bastidor);padding:24px;text-align:center;isolation:isolate}
.foto-slot::before{content:"";position:absolute;inset:12px;border:1px dashed var(--fumaca);pointer-events:none}
.foto-slot .ic{width:24px;height:24px;color:var(--po)}
.foto-slot .cred{max-width:28ch}
.foto-slot .legenda{max-width:32ch}
.foto-slot.coxia{background:var(--coxia)}
.modo-leitura .foto-slot{background:var(--cinza-100)}
.modo-leitura .foto-slot::before{border-color:var(--penumbra)}

/* LP04 · Cartela do Vazio */
.vazio{background:radial-gradient(110% 75% at 12% 0%,rgb(248 249 244 / .09) 0%,rgb(248 249 244 / 0) 62%),var(--sala)}
.vazio-linhas{list-style:none;margin:0 0 var(--e-7);padding:0;display:grid;gap:var(--e-2)}
.vazio-linhas li{font:600 clamp(22px,2.6vw,32px)/1.2 var(--font-letreiro);font-variation-settings:"wdth" 100;color:var(--po)}
.vazio .h-filme{max-width:22ch}

/* LP05 · Virada */
.virada-crenca{position:relative;display:inline-block;margin:0 0 var(--e-6);font:600 clamp(22px,2.6vw,32px)/1.25 var(--font-letreiro);font-variation-settings:"wdth" 100;color:var(--po)}
.virada-crenca::after{content:"";position:absolute;left:-4px;right:-4px;top:52%;height:2px;background:var(--estacao-grafismo)}
.virada .corpo{margin-top:var(--e-6);max-width:var(--coluna-leitura)}

/* LP06 · Rolo de Depoimentos */
/* a grade tem tantas colunas quanto itens (até 4): nunca sobra coluna vazia */
.rolo{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:var(--e-5)}
.depo{margin:0;display:grid;gap:var(--e-4);align-content:start}
.depo .video{position:relative;aspect-ratio:9/16;min-height:0}
.depo .play{position:absolute;left:16px;bottom:16px;width:44px;height:44px;border-radius:50%;border:1px solid var(--tela);display:grid;place-items:center;color:var(--tela);z-index:2}
.depo .play .ic{width:18px;height:18px}
.depo h3{margin:0;padding-left:var(--e-4);border-left:2px solid var(--estacao-grafismo);font:700 15px/1.3 var(--font-letreiro);font-variation-settings:"wdth" 106;letter-spacing:.06em;text-transform:uppercase;color:var(--tela)}
.aviso{margin-top:var(--e-6);display:flex;gap:10px;align-items:flex-start}
.aviso .ic{width:20px;height:20px;color:var(--po)}
@media (max-width:1024px){.rolo{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:var(--e-4);padding-bottom:var(--e-4);margin-right:calc(-1 * var(--pad));padding-right:var(--pad);scrollbar-color:var(--fumaca) var(--bastidor);scrollbar-width:thin}
  .depo{flex:0 0 min(62vw,260px);scroll-snap-align:start}}
.rolo-dica{display:none;margin-top:var(--e-3);align-items:center;gap:8px}
@media (max-width:1024px){.rolo-dica{display:flex}}

/* LP07 · Régua de Prova (spec 6.16) */
.provas{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:var(--e-7) var(--e-6)}
.prova{margin:0;border-left:2px solid var(--estacao-grafismo);padding-left:16px;display:grid;gap:10px;align-content:start}
.prova-n{font:700 clamp(56px,7vw,80px)/.9 var(--font-letreiro);font-variation-settings:"wdth" 75;font-variant-numeric:lining-nums tabular-nums;color:var(--tela)}
.prova-o-que{font:600 18px/1.3 var(--font-letreiro);font-variation-settings:"wdth" 100;color:var(--cal)}
.prova-regua{margin:0;font:400 13px/1.45 var(--font-texto);color:var(--po)}
.origem{display:inline-block;width:16px;margin-right:8px;vertical-align:middle;border-top:2px solid var(--po)}
[data-origem="terceiro"] .origem{border-top-style:dashed}
[data-origem="mercado"] .origem{border-top-style:dotted}
[data-origem="em-validacao"]{border-left-style:dashed;border-left-color:var(--fumaca)}
[data-origem="em-validacao"] .origem{border-top-style:dashed;border-top-color:var(--fumaca)}
[data-origem="em-validacao"] .prova-n{font:600 22px/1.2 var(--font-letreiro);font-variation-settings:"wdth" 100;color:var(--po);text-transform:uppercase;letter-spacing:.06em}
.bloqueio{display:flex;gap:8px;align-items:flex-start;color:var(--atencao);font:400 13px/1.45 var(--font-texto)}
.bloqueio .ic{width:16px;height:16px;margin-top:2px}
@media (max-width:900px){.provas{grid-template-columns:1fr}}

/* LP08 · Método ARTE e Mapa da Trilha */
.mapa{margin:0 0 var(--e-8);max-width:980px}
.pilares{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--e-5)}
.pilar{background:var(--bastidor);padding:var(--e-6);display:grid;gap:var(--e-3);align-content:start;border-top:2px solid var(--fio)}
.pilar[data-foco]{border-top-color:var(--estacao-grafismo)}
.pilar .letra{font:800 56px/.9 var(--font-letreiro);font-variation-settings:"wdth" 75;color:var(--tela)}
.pilar h3{margin:0;font:600 22px/1.2 var(--font-letreiro);font-variation-settings:"wdth" 100;color:var(--tela)}
.pilar .cred{color:var(--po)}
.pilar[data-foco] .cred{color:var(--estacao-destaque)}
@media (max-width:900px){.pilares{grid-template-columns:1fr}.pilar[data-foco]{order:-1}}

/* LP09 · Roteiro (acordeão) */
.roteiro{border-top:1px solid var(--fio)}
.modulo{border-bottom:1px solid var(--fio)}
.modulo summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:72px minmax(0,1fr) 32px;gap:var(--e-5);align-items:center;padding:var(--e-6) 0;min-height:44px}
.modulo summary::-webkit-details-marker{display:none}
.modulo .num{font:700 40px/.9 var(--font-letreiro);font-variation-settings:"wdth" 75;color:var(--po);font-variant-numeric:tabular-nums}
.modulo[open] .num{color:var(--estacao-destaque)}
.modulo .tit{display:grid;gap:8px}
.modulo .tit strong{font:700 clamp(22px,2.4vw,32px)/1 var(--font-letreiro);font-variation-settings:"wdth" 100;text-transform:uppercase;color:var(--tela);letter-spacing:-.005em}
.modulo .chev{width:24px;height:24px;color:var(--cal);transition:transform var(--t-ui) var(--curva-cena)}
.modulo[open] .chev{transform:rotate(180deg)}
.modulo .miolo{display:grid;grid-template-columns:72px minmax(0,1fr);gap:var(--e-5);padding:0 0 var(--e-6)}
.modulo .miolo > div{display:grid;gap:var(--e-3);max-width:var(--coluna-leitura)}
.etiqueta{display:inline-flex;align-items:center;gap:8px;justify-self:start;padding:4px 10px;border:1px solid var(--fio);font:500 11.5px/1.3 var(--font-letreiro);font-variation-settings:"wdth" 125;letter-spacing:.16em;text-transform:uppercase;color:var(--po)}
@media (max-width:640px){.modulo summary{grid-template-columns:44px minmax(0,1fr) 24px;gap:var(--e-4)}.modulo .num{font-size:30px}.modulo .miolo{grid-template-columns:1fr;padding-left:60px}}
@media (max-width:380px){.modulo .miolo{padding-left:0}}

/* LP10 · Fotograma dos Rituais */
.triptico{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--e-5)}
.rito{margin:0;display:grid;gap:var(--e-4);align-content:start}
.rito .quadro{aspect-ratio:4/5}
.rito h3{margin:0;font:700 26px/1 var(--font-letreiro);font-variation-settings:"wdth" 100;text-transform:uppercase;color:var(--tela)}
.rito .voz-off{font-size:22px;line-height:1.3;color:var(--cal)}
@media (max-width:900px){.triptico{grid-template-columns:1fr;max-width:520px}}

/* LP11 · Elenco */
.elenco{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--e-5)}
.elenco[data-n="2"]{grid-template-columns:repeat(2,minmax(0,1fr));max-width:820px}
/* um só professor: retrato com o texto ao lado, sem 2/3 da largura vazios */
.elenco[data-n="1"]{grid-template-columns:minmax(0,1fr);max-width:none}
.elenco[data-n="1"] .prof{grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:var(--e-8);align-items:center}
.elenco[data-n="1"] .prof .texto{display:grid;gap:var(--e-3)}
@media (max-width:900px){.elenco[data-n="1"] .prof{grid-template-columns:1fr;gap:var(--e-4);max-width:420px}}
.prof{margin:0;display:grid;gap:var(--e-3);align-content:start}
.prof .quadro{aspect-ratio:4/5}
.prof h3{margin:0;font:600 22px/1.2 var(--font-letreiro);font-variation-settings:"wdth" 100;color:var(--tela)}
@media (max-width:900px){.elenco:not([data-n="1"]){grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.elenco:not([data-n="1"]){grid-template-columns:1fr;max-width:420px}}

/* LP12 · Para Quem É */
.para-quem{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--e-8)}
.para-quem h3{margin:0 0 var(--e-5);font:600 22px/1.2 var(--font-letreiro);font-variation-settings:"wdth" 100;color:var(--tela)}
.lista{list-style:none;margin:0;padding:0;display:grid;gap:var(--e-4)}
.lista li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;align-items:start;font:400 var(--fs-corpo)/1.55 var(--font-texto);color:var(--cal)}
.lista .ic{color:var(--sucesso);margin-top:2px}
.lista.nao .ic{color:var(--fumaca)}
.lista.nao li{color:var(--po)}
@media (max-width:900px){.para-quem{grid-template-columns:1fr;gap:var(--e-7)}}

/* LP13 · Locação */
.locacao{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--e-8);align-items:start}
.nap{font-style:normal;display:grid;gap:var(--e-2);font:400 var(--fs-corpo)/1.55 var(--font-texto);color:var(--cal)}
.nap strong{font:700 15px/1.3 var(--font-letreiro);font-variation-settings:"wdth" 106;letter-spacing:.06em;text-transform:uppercase;color:var(--tela)}
.linha-ic{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;align-items:start}
.linha-ic .ic{color:var(--po);margin-top:2px}
.fotos-local{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--e-4)}
.fotos-local .quadro{aspect-ratio:4/3}
.fotos-local .mapa-slot{grid-column:1/-1;aspect-ratio:21/9}
@media (max-width:900px){.locacao{grid-template-columns:1fr;gap:var(--e-7)}}
@media (max-width:480px){.fotos-local{grid-template-columns:1fr}.fotos-local .mapa-slot{aspect-ratio:4/3}}

/* LP14 · Ficha da Formação (Modo Leitura) */
.ficha{background:var(--tela);color:var(--sala)}
.ficha-grade{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--e-8);align-items:start}
.ficha .sec-head{margin-bottom:var(--e-6)}
.inclui{list-style:none;margin:0;padding:0;border-top:1px solid var(--fumaca)}
.inclui li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--fumaca);font:400 var(--fs-corpo)/1.5 var(--font-texto);color:var(--sala)}
.inclui .ic{color:var(--sucesso-claro);margin-top:1px}
.oferta{background:var(--cinza-100);padding:var(--e-6);display:grid;gap:var(--e-5);border-top:3px solid var(--sala)}
.oferta .selo-oferta{display:flex;align-items:center;gap:16px}
.oferta .selo-oferta > div{width:120px;height:120px;flex:none}
.dl{display:grid;gap:0;margin:0}
.dl > div{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--fumaca)}
.dl dt{font:500 12px/1.4 var(--font-letreiro);font-variation-settings:"wdth" 125;letter-spacing:.16em;text-transform:uppercase;color:var(--ardosia);padding-top:3px}
.dl dd{margin:0;font:400 16px/1.5 var(--font-texto);color:var(--sala)}
.preco{font:700 28px/1.1 var(--font-letreiro);font-variation-settings:"wdth" 100;color:var(--sala)}
.barra-embutida{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:var(--sala);color:var(--cal)}
.barra-embutida .ic{width:16px;height:16px;color:var(--areia);margin-top:1px}
.barra-embutida .cred{color:var(--cal)}
.tabela-wrap{overflow-x:auto;margin-top:var(--e-6)}
.tabela{width:100%;border-collapse:collapse;font:400 16px/1.45 var(--font-texto);color:var(--sala)}
.tabela caption{text-align:left;padding-bottom:12px}
.tabela th,.tabela td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--fumaca);vertical-align:top}
.tabela thead th{background:var(--cinza-100);font:500 12px/1.4 var(--font-letreiro);font-variation-settings:"wdth" 125;letter-spacing:.14em;text-transform:uppercase;color:var(--sala)}
.tabela tbody th{font:600 16px/1.4 var(--font-texto);color:var(--sala)}
.letra-miuda{display:grid;gap:var(--e-3);margin-top:var(--e-6)}
.letra-miuda p{margin:0;font:400 14px/1.55 var(--font-texto);color:var(--ardosia);max-width:var(--coluna-leitura)}
@media (max-width:900px){.ficha-grade{grid-template-columns:1fr;gap:var(--e-7)}}
@media (max-width:430px){
  .tabela thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .tabela,.tabela tbody,.tabela tr,.tabela th,.tabela td{display:block;width:100%}
  .tabela tr{padding:12px 0;border-bottom:1px solid var(--fumaca)}
  .tabela th,.tabela td{border:0;padding:2px 0}
  .tabela td::before{content:attr(data-rotulo) ": ";font:500 11.5px/1.4 var(--font-letreiro);font-variation-settings:"wdth" 125;letter-spacing:.12em;text-transform:uppercase;color:var(--ardosia)}
  .dl > div{grid-template-columns:1fr;gap:2px}
}

/* Calendário de Turmas (LP14 embutido e LP22 avulso): situação em texto, nunca em vermelho, nunca contador */
.situacao{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.situacao .ic{width:16px;height:16px}
.situacao[data-status="aberta"] .ic,.situacao[data-status="poucas"] .ic{color:var(--sucesso-claro)}
.situacao[data-status="lotada"]{color:var(--ardosia)}
.tabela tr[data-status="lotada"] th{color:var(--ardosia)}
.calendario-sec .tabela{color:var(--cal)}
.calendario-sec .tabela th,.calendario-sec .tabela td{border-bottom-color:var(--fio)}
.calendario-sec .tabela thead th{background:var(--coxia);color:var(--po)}
.calendario-sec .tabela tbody th{color:var(--tela)}
.calendario-sec .situacao[data-status="aberta"] .ic,.calendario-sec .situacao[data-status="poucas"] .ic{color:var(--sucesso)}
.calendario-sec .situacao[data-status="lotada"],.calendario-sec .tabela tr[data-status="lotada"] th{color:var(--po)}

/* Ponte: o mesmo botão (L1) no fim de uma seção longa */
.ponte{display:flex;flex-wrap:wrap;align-items:center;gap:var(--e-3) var(--e-6);margin-top:var(--e-8);padding-top:var(--e-6);border-top:1px solid var(--fio)}
.ponte .micro{margin:0;font:400 var(--fs-apoio)/1.45 var(--font-texto);color:var(--po);max-width:420px}
@media (max-width:430px){.ponte{display:grid}}

/* LP15 · Perguntas */
.faq{max-width:880px;border-top:1px solid var(--fio)}
.faq details{border-bottom:1px solid var(--fio)}
.faq summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 24px;gap:var(--e-5);align-items:center;padding:var(--e-5) 0;min-height:44px;font:600 var(--fs-inter)/1.3 var(--font-letreiro);font-variation-settings:"wdth" 100;color:var(--tela)}
.faq summary::-webkit-details-marker{display:none}
.faq .chev{width:24px;height:24px;transition:transform var(--t-ui) var(--curva-cena)}
.faq details[open] .chev{transform:rotate(180deg)}
.faq .resp{padding:0 0 var(--e-5);max-width:var(--coluna-leitura)}

/* LP16 · Créditos Finais */
.creditos{text-align:left;overflow:hidden;padding-bottom:var(--e-8)}
.creditos .wrap{position:relative;z-index:2}
.creditos .h-filme{max-width:16ch}
.creditos .corpo{max-width:560px;margin-top:var(--e-5)}
.creditos .cta{margin-top:var(--e-7)}
.tagline{margin:0;font:800 clamp(40px,6vw,88px)/.98 var(--font-letreiro);font-variation-settings:"wdth" 112;text-transform:uppercase;letter-spacing:-.02em;color:var(--tela)}
.tagline em{font:300 italic 1.2em/.8 var(--font-off);font-variation-settings:"opsz" 72;text-transform:none;letter-spacing:0;color:var(--estacao-destaque)}
.tagline span{display:block}
.fecho-off{margin-top:var(--e-4)}
.proxima{display:flex;align-items:center;gap:var(--e-5);margin-top:var(--e-7);padding-top:var(--e-6);border-top:1px solid var(--fio);max-width:620px}
.proxima > div:first-child{width:120px;height:120px;flex:none}
.rodape{margin-top:var(--e-10);padding-top:var(--e-6);border-top:1px solid var(--fio);display:grid;gap:var(--e-6)}
.rodape-grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--e-6)}
.rodape-grade .legenda a{color:var(--cal)}
@media (max-width:900px){.rodape-grade{grid-template-columns:1fr}}
@media (max-width:640px){.proxima{flex-direction:column;align-items:flex-start}}

/* LP17 · Barra Fixa (só celular) */
.barra-fixa{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;align-items:center;gap:12px;min-height:64px;padding:8px 16px calc(8px + env(safe-area-inset-bottom));background:rgb(24 24 24 / .95);border-top:1px solid var(--fio);transform:translateY(110%);transition:transform var(--t-ui) var(--curva-cena)}
.barra-fixa.visivel{transform:none}
.barra-fixa .rotulo-produto{flex:none;max-width:104px;padding:6px 8px;border:1px solid var(--fumaca);font:500 10.5px/1.25 var(--font-letreiro);font-variation-settings:"wdth" 110;letter-spacing:.12em;text-transform:uppercase;color:var(--tela)}
.barra-fixa .botao{flex:1;width:auto;min-height:48px;font-size:14px;padding:8px 12px;letter-spacing:.04em}
.barra-fixa .botao .ic{width:18px;height:18px}
@media (max-width:640px){.barra-fixa{display:flex}body.tem-barra{padding-bottom:calc(72px + env(safe-area-inset-bottom))}}

/* LP18 · Formulário Curto */
.form-grade{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--e-8);align-items:start}
.form{display:grid;gap:var(--e-5);background:var(--bastidor);padding:var(--e-7)}
.campo{display:grid;gap:8px}
.campo label{font:600 15px/1.3 var(--font-letreiro);font-variation-settings:"wdth" 100;color:var(--tela)}
.campo input,.campo select{width:100%;min-height:52px;padding:12px 14px;border:1px solid var(--fumaca);border-radius:0;background:var(--coxia);color:var(--tela);font:400 17px/1.3 var(--font-texto);appearance:none}
.campo select{background-image:linear-gradient(45deg,transparent 50%,var(--cal) 50%),linear-gradient(135deg,var(--cal) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
.campo input:focus-visible,.campo select:focus-visible{outline:2px solid var(--areia);outline-offset:2px}
.campo .dica{font:400 14px/1.4 var(--font-texto);color:var(--po)}
.campo .erro{display:none;gap:8px;align-items:flex-start;color:var(--erro);font:400 14px/1.4 var(--font-texto)}
.campo .erro .ic{width:16px;height:16px;margin-top:2px}
.campo[data-erro] .erro{display:flex}
.campo[data-erro] input,.campo[data-erro] select{border-color:var(--erro)}
.consentimento{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;align-items:start;font:400 15px/1.5 var(--font-texto);color:var(--cal);cursor:pointer}
.consentimento input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--tela);border-radius:0}
.consentimento a{color:var(--tela)}
.form .botao{width:100%}
.form .falta{margin:0;font:400 14px/1.4 var(--font-texto);color:var(--atencao);display:flex;gap:8px}
.form .falta[hidden]{display:none}
.obrigado{display:grid;gap:var(--e-5);justify-items:start;background:var(--bastidor);padding:var(--e-7)}
.obrigado .esfera{width:140px;height:140px}
.obrigado .corpo{hyphens:manual}
.obrigado .acoes{display:grid;gap:var(--e-4);justify-items:start;width:100%}
.obrigado .links{display:flex;flex-wrap:wrap;gap:8px 24px}
/* ação secundária: link sublinhado (spec 12.1) */
.link-sec{display:inline-flex;align-items:center;gap:8px;min-height:44px;color:var(--tela);font:600 15px/1.3 var(--font-letreiro);font-variation-settings:"wdth" 100;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.link-sec .ic{width:18px;height:18px;color:var(--po)}
.link-sec:focus-visible{outline:2px solid var(--areia);outline-offset:3px}
/* falha de envio: nunca mostra obrigado; erro em Ferrugem Luz com ícone, frase e saída pelo WhatsApp */
.envio-erro{display:grid;gap:8px;padding:14px 16px;border:1px solid var(--erro);color:var(--cal);font:400 15px/1.5 var(--font-texto)}
.envio-erro[hidden]{display:none}
.envio-erro p{margin:0;display:flex;gap:8px;align-items:flex-start;color:var(--erro)}
.envio-erro .ic{width:16px;height:16px;margin-top:3px}
@media (max-width:430px){.obrigado .acoes .botao{width:100%}}
@media (max-width:900px){.form-grade{grid-template-columns:1fr;gap:var(--e-6)}}
@media (max-width:480px){.form,.obrigado{padding:var(--e-5) var(--e-4)}}

/* LP20 · Sala de Projeção */
.projecao{display:grid;grid-template-columns:minmax(0,8fr) minmax(0,4fr);gap:var(--e-7);align-items:start}
.player{position:relative;aspect-ratio:16/9;background:var(--nanquim)}
.player video{width:100%;height:100%;display:block;background:var(--nanquim)}
.player .capa{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(16px,3vw,40px);background:radial-gradient(110% 75% at 12% 0%,rgb(248 249 244 / .09) 0%,rgb(248 249 244 / 0) 62%),var(--sala)}
.player .capa .h-secao{font-size:clamp(26px,3.6vw,48px);max-width:12ch}
.player .capa .cred{display:flex;gap:10px;align-items:center}
.capitulos{list-style:none;margin:0;padding:0;border-top:1px solid var(--fio);counter-reset:cap}
.capitulos li{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;min-height:48px;border-bottom:1px solid var(--fio);font:600 17px/1.3 var(--font-letreiro);font-variation-settings:"wdth" 100;color:var(--cal)}
.capitulos li::before{counter-increment:cap;content:counter(cap,decimal-leading-zero);font:500 12px/1 var(--font-letreiro);font-variation-settings:"wdth" 125;letter-spacing:.18em;color:var(--po)}
.transcricao{margin-top:var(--e-6);border-top:1px solid var(--fio);border-bottom:1px solid var(--fio)}
.transcricao summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;min-height:52px;font:600 17px/1.3 var(--font-letreiro);font-variation-settings:"wdth" 100;color:var(--tela)}
.transcricao summary::-webkit-details-marker{display:none}
.transcricao .miolo{display:grid;gap:var(--e-4);padding-bottom:var(--e-5);max-width:var(--coluna-leitura)}
.transcricao h3{margin:var(--e-2) 0 0;font:500 12px/1.4 var(--font-letreiro);font-variation-settings:"wdth" 125;letter-spacing:.18em;text-transform:uppercase;color:var(--po)}
@media (max-width:900px){.projecao{grid-template-columns:1fr}}

/* LP21 · Faixa de Manifesto */
.manifesto{margin:0;max-width:1000px;font:500 clamp(26px,3.4vw,44px)/1.12 var(--font-letreiro);font-variation-settings:"wdth" 100;text-transform:uppercase;letter-spacing:-.005em;color:var(--tela)}
.manifesto .off{color:var(--estacao-destaque)}
.letreiro-corrido{border-bottom:1px solid var(--fio);min-height:49px;overflow:hidden}

/* Autoavaliação (Pro) */
.auto{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--e-8);align-items:start}
.perguntas{list-style:none;margin:0;padding:0;border-top:1px solid var(--fio);counter-reset:pq}
.perguntas li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--e-5);align-items:center;padding:var(--e-5) 0;border-bottom:1px solid var(--fio)}
.perguntas fieldset{border:0;margin:0;padding:0;display:contents}
.perguntas legend{font:600 19px/1.35 var(--font-letreiro);font-variation-settings:"wdth" 100;color:var(--tela);padding:0;float:left;width:100%}
.sim-nao{display:flex;gap:0}
.sim-nao label{position:relative;cursor:pointer}
.sim-nao input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sim-nao span{display:grid;place-items:center;min-width:64px;min-height:44px;padding:0 14px;border:1px solid var(--fumaca);font:700 14px/1 var(--font-letreiro);font-variation-settings:"wdth" 106;letter-spacing:.06em;text-transform:uppercase;color:var(--cal)}
.sim-nao label + label span{border-left:0}
.sim-nao input:checked + span{background:var(--tela);color:var(--sala);border-color:var(--tela)}
.sim-nao input:focus-visible + span{outline:2px solid var(--areia);outline-offset:2px}
.resultado{background:var(--bastidor);padding:var(--e-6);display:grid;gap:var(--e-4);border-top:2px solid var(--estacao-grafismo);position:sticky;top:24px}
.resultado .contagem{font:700 56px/.9 var(--font-letreiro);font-variation-settings:"wdth" 75;color:var(--tela);font-variant-numeric:tabular-nums}
.resultado .contagem.frase{font:600 var(--fs-inter)/1.25 var(--font-letreiro);font-variation-settings:"wdth" 100}
.resultado .cta[hidden]{display:none}
@media (max-width:900px){.auto{grid-template-columns:1fr}.resultado{position:static}}
@media (max-width:520px){.perguntas li{grid-template-columns:1fr;gap:var(--e-3)}}

/* Edições anteriores (Talks) */
.edicoes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--e-5)}
.edicoes figure{margin:0;display:grid;gap:var(--e-3)}
.edicoes .quadro{aspect-ratio:3/2}
@media (max-width:900px){.edicoes{grid-template-columns:1fr;max-width:560px}}

/* Revelação (spec 6.17): uma vez por bloco, desligada com movimento reduzido */
@keyframes revelar{from{opacity:0;filter:blur(10px) contrast(.7) brightness(.6)}to{opacity:1;filter:none}}
.revela{opacity:0}
.revela.vista{animation:revelar var(--t-revelar) var(--curva-cena) both}
@media (prefers-reduced-motion:reduce){.revela{opacity:1}.revela.vista{animation:none}}
@media print{.revela{opacity:1}.barra-fixa{display:none}}

/* painel do modelo (?painel=1): ferramenta de revisão, nunca vai ao ar */
.painel{position:fixed;right:16px;bottom:16px;z-index:60;width:min(420px,calc(100vw - 32px));max-height:min(78vh,720px);overflow:auto;background:var(--bastidor);border:1px solid var(--fumaca);padding:20px;display:grid;gap:14px;font:400 14px/1.45 var(--font-texto);color:var(--cal)}
.painel h2{margin:0;font:700 16px/1.2 var(--font-letreiro);font-variation-settings:"wdth" 106;letter-spacing:.06em;text-transform:uppercase;color:var(--tela)}
.painel .vars{display:flex;flex-wrap:wrap;gap:8px}
.painel .vars a{display:inline-flex;align-items:center;min-height:36px;padding:0 10px;border:1px solid var(--fumaca);color:var(--cal);text-decoration:none;font:600 13px/1 var(--font-letreiro)}
.painel .vars a[aria-current]{background:var(--tela);color:var(--sala)}
.painel ul{margin:0;padding-left:18px}
.painel .ok{color:var(--sucesso)}.painel .ruim{color:var(--erro)}.painel .alerta{color:var(--atencao)}
.painel label{display:grid;gap:4px}
.painel input{min-height:36px;background:var(--coxia);color:var(--tela);border:1px solid var(--fumaca);border-radius:0;padding:4px 8px;font:inherit}
@media (max-width:640px){.painel{bottom:88px}}
</style>

    <symbol id="i-file-badge" viewBox="0 0 24 24"><path d="M12 22h6a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v3"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M5 17a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M7 16.5 8 22l-3-1-3 1 1-5.5"/></symbol>

    <symbol id="i-triangle-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
    <symbol id="i-circle-dashed" viewBox="0 0 24 24"><path d="M10.1 2.182a10 10 0 0 1 3.8 0"/><path d="M13.9 21.818a10 10 0 0 1-3.8 0"/><path d="M17.609 3.721a10 10 0 0 1 2.69 2.7"/><path d="M2.182 13.9a10 10 0 0 1 0-3.8"/><path d="M20.279 17.609a10 10 0 0 1-2.7 2.69"/><path d="M21.818 10.1a10 10 0 0 1 0 3.8"/><path d="M3.721 6.391a10 10 0 0 1 2.7-2.69"/><path d="M6.391 20.279a10 10 0 0 1-2.69-2.7"/></symbol>
    <symbol id="i-images" viewBox="0 0 24 24"><path d="M18 22H4a2 2 0 0 1-2-2V6"/><path d="m22 13-1.296-1.296a2.41 2.41 0 0 0-3.408 0L11 18"/><circle cx="12" cy="8" r="2"/><rect width="16" height="16" x="6" y="2"/></symbol>
    <symbol id="i-arrow-left-right" viewBox="0 0 24 24"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></symbol>
  </defs>

<script>
/* =====================================================================
   MOTOR DA LP. Lê LP_VARIANTES, monta as seções na ordem, gera JSON-LD do mesmo
   objeto, liga a medição (dataLayer) e audita as leis L1, L6, L8 e o teto do
   Modo Leitura. Sem dependências além de vforms.js e vviz.js.
   ===================================================================== */
(function () {
  'use strict';
  var Q = new URLSearchParams(location.search);
  var VAR = window.LP_VARIANTES, ESC = window.LP_ESCOLA, FR = window.LP_FRASES, PROC = window.LP_PROCEDENCIA || {};
  var RAIZ = document.getElementById('lp');
  /* HTML estático exportado: a página já chega desenhada (robôs e prévias leem tudo); o motor só liga o comportamento */
  var ESTATICO = RAIZ.getAttribute('data-estatico');
  var chave = ESTATICO || (Q.get('variante') && VAR[Q.get('variante')] ? Q.get('variante') : window.LP_PADRAO);
  var LP = window.LP = VAR[chave];
  LP.chave = chave;
  /* {{A_CONFIRMAR}} e {{A_CONFIRMAR: valor encontrado}} são, os dois, pendência */
  var PEND = /\{\{A_CONFIRMAR/;
  var PAINEL = !ESTATICO && Q.get('painel') === '1';
  var PUBLICACAO = Q.get('modo') === 'publicacao';
  var SIMULACAO = !!(Q.get('hoje') || Q.get('turma'));
  var dataLayer = window.dataLayer = window.dataLayer || [];
  var pendencias = [], procedencias = [];

  /* persona da mesma oferta (spec 9.5, teste A/B 4): troca só os campos que a persona define */
  var PERSONA = ESTATICO ? (RAIZ.getAttribute('data-persona') || null) : (Q.get('persona') || null);
  if (!ESTATICO) {
    var ov = PERSONA && LP.personas && LP.personas[PERSONA];
    if (ov) Object.keys(ov).forEach(function (k) {
      LP[k] = (ov[k] && typeof ov[k] === 'object' && !Array.isArray(ov[k]) && LP[k] && typeof LP[k] === 'object') ? Object.assign({}, LP[k], ov[k]) : ov[k];
    });
    else PERSONA = null;
    /* simulação de turma lotada (ferramenta de revisão) */
    if (Q.get('turma') === 'lotada') (LP.turmas || []).forEach(function (x) { x.status = 'lotada'; });
  }

  /* ---------- data de hoje (simulável para teste da Barra de Turma) ---------- */
  function hojeISO() {
    var h = Q.get('hoje');
    if (h && /^\d{4}-\d{2}-\d{2}$/.test(h)) return h;
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  var HOJE = hojeISO();
  var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  function dataValida(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(Date.parse(s + 'T12:00:00')); }
  function futura(s) { return dataValida(s) && s > HOJE; }
  function dmy(s) { var p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function mes(s) { return MESES[parseInt(s.split('-')[1], 10) - 1]; }
  function turmasFuturas() { return (LP.turmas || []).filter(function (t) { return futura(t.inicio); }).sort(function (a, b) { return a.inicio < b.inicio ? -1 : 1; }); }
  function turmasAbertas() { return turmasFuturas().filter(function (t) { return t.status !== 'lotada'; }); }
  /* todas as turmas futuras lotadas: o botão inteiro (L1) vira lista de espera, e a turma lotada continua visível como prova de demanda */
  var LOTADA = !ESTATICO && turmasFuturas().length > 0 && turmasAbertas().length === 0 && !!LP.cta.listaEspera;
  if (LOTADA) LP.cta = Object.assign({}, LP.cta, { rotulo: LP.cta.listaEspera.rotulo, mensagem: LP.cta.listaEspera.mensagem, microcopy: 'Quando abrir a próxima turma, uma pessoa do time chama você no WhatsApp.' });

  /* ---------- texto: escape, *voz em off*, pendências ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function subst(s) {
    var prox = turmasAbertas()[0];
    return String(s)
      .replace(/\{proxima\}/g, prox ? dmy(prox.inicio) : '{{A_CONFIRMAR}} [P 15]')
      .replace(/\{arrependimento\}/g, FR.arrependimento)
      .replace(/\{produto\}/g, LP.nomeCurto || '');
  }
  function t(s, onde) {
    if (s == null) return '';
    s = subst(s);
    if (PEND.test(s)) pendencias.push({ onde: onde || '', texto: s.replace(/\*/g, '') });
    var h = esc(s);
    h = h.replace(/\*([^*]+)\*/g, '<em class="off">$1</em>');
    h = h.replace(/\{\{A_CONFIRMAR: ([^}]+)\}\}/g, '<span class="pend pend-achado" data-pendente title="Encontrado no site oficial, ainda não confirmado pela escola">$1</span>');
    h = h.replace(/\{\{A_CONFIRMAR\}\}/g, '<span class="pend" data-pendente>{{A_CONFIRMAR}}</span>');
    h = h.replace(/\[P (\d+)\]/g, '<span class="pend-p" data-p="$1">[P $1]</span>');
    return h;
  }
  function limpo(s) { s = subst(s || ''); return PEND.test(s) ? null : s.replace(/\*/g, '').replace(/\s*\[P \d+\]/g, ''); }
  function ic(nome, cls) { return '<svg class="ic ' + (cls || '') + '" aria-hidden="true" focusable="false"><use href="#i-' + nome + '"/></svg>'; }
  /* o rótulo vai em texto real; o motor só desenha o mini Mapa da Trilha (espaço reservado, sem salto de layout) */
  function marcador(rotulo) { return '<p class="marc cred"><span class="marc-ic" aria-hidden="true" data-vforms=\'{"forma":"marcador-estacao"}\'></span><span>' + esc(rotulo) + '</span></p>'; }
  function vf(o, extra) { return '<div data-vforms=\'' + JSON.stringify(o).replace(/'/g, '&#39;') + '\'' + (extra || '') + '></div>'; }
  function fotoSlot(rotulo, direcao, cls) {
    return '<div class="foto-slot ' + (cls || '') + '" role="img" aria-label="Espaço reservado: ' + esc(rotulo) + '">' + ic('images') +
      '<p class="cred">Foto real da escola, com autorização</p>' + (direcao ? '<p class="legenda">' + t(direcao) + '</p>' : '') + '</div>';
  }
  /* procedência de um texto (de onde veio a frase): registro do painel, nunca da página publicada.
     Crédito visível ao público só na prova com número (LP07) e nas frases de conformidade. */
  function registra(txt, onde) { if (txt) procedencias.push({ onde: onde || '', texto: subst(txt) }); }
  function fonte(txt, onde) {
    if (!txt) return '';
    registra(txt, onde);
    return PAINEL ? '<p class="procedencia" data-procedencia><b>Procedência, só no painel:</b> ' + t(txt) + '</p>' : '';
  }
  function waLink(msg) {
    var num = (ESC.whatsapp || '').replace(/\D/g, '');
    return 'https://wa.me/' + (num && !PEND.test(ESC.whatsapp) ? num : '') + '?text=' + encodeURIComponent(msg || '');
  }

  /* ---------- destino único do CTA (L1) ---------- */
  function hrefCTA() {
    if (LP.cta.destino === 'formulario') return '#inscricao';
    if (PEND.test(ESC.whatsapp)) pendencias.push({ onde: 'cta', texto: 'WhatsApp oficial do ' + LP.nomeCurto + ': {{A_CONFIRMAR}} [P 8]' });
    return waLink(LP.cta.mensagem);
  }
  var HREF = hrefCTA();
  function botao(pos) {
    var ext = LP.cta.destino === 'whatsapp';
    return '<a class="botao" data-cta="' + pos + '" href="' + esc(HREF) + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '>' +
      '<span>' + esc(LP.cta.rotulo) + '</span>' + ic('arrow-right') + '</a>';
  }
  function cta(pos, semMicro) {
    return '<div class="cta">' + botao(pos) + (semMicro || !LP.cta.microcopy ? '' : '<p class="micro">' + t(LP.cta.microcopy) + '</p>') + '</div>';
  }
  /* Ponte: o mesmo botão (mesmo destino e rótulo, L1) no fim de uma seção longa */
  function ponte(id) {
    return '<div class="ponte">' + botao('ponte-' + id.toLowerCase()) + (LP.cta.microcopy ? '<p class="micro">' + t(LP.cta.microcopy) + '</p>' : '') + '</div>';
  }
  function secHead(sobre, titulo, apoio, nivel) {
    return '<header class="sec-head">' + (sobre ? marcador(sobre) : '') +
      '<h2 class="' + (nivel || 'h-secao') + '">' + t(titulo) + '</h2>' +
      (apoio ? '<p class="chamada apoio-sec">' + t(apoio) + '</p>' : '') + '</header>';
  }
  function secao(id, tipo, cls, miolo, attrs) {
    return '<section class="sec ' + (cls || '') + '" id="' + id + '" data-lp="' + id.toUpperCase() + '" data-tipo="' + tipo + '"' + (attrs || '') + '><div class="wrap">' + miolo + '</div></section>';
  }

  /* ===================== COMPONENTES ===================== */
  var C = {};

  /* LP01 · Barra de Turma: só com data válida e futura; some quando vence */
  C.LP01 = function () {
    var tf = turmasFuturas();
    if (!tf.length || LP.etapa === 'M1' || LP.chave === 'talks') return '';
    var tb = turmasAbertas()[0], txt;
    if (tb) {
      txt = 'Turma de ' + mes(tb.inicio) + ' · começa em <b>' + dmy(tb.inicio) + '</b>';
      if (dataValida(tb.inscricoesAte)) txt += ' · inscrições até ' + dmy(tb.inscricoesAte);
      if (tb.vagasTotal && tb.vagasRestantes != null && dataValida(tb.vagasEm)) txt += ' · restam ' + tb.vagasRestantes + ' de ' + tb.vagasTotal + ' em ' + dmy(tb.vagasEm);
    } else {
      /* estado lotado: a turma real continua à vista; nunca vermelho, nunca contador */
      tb = tf[0];
      txt = 'Turma de ' + mes(tb.inicio) + ' · <b>lotada</b>' + (LP.cta.listaEspera ? ' · lista de espera aberta para a próxima' : '');
    }
    return '<div class="barra-turma" data-lp="LP01" data-tipo="interface" data-inicio="' + tb.inicio + '" data-fonte="' + esc(tb.fonte || '') + '"><div class="wrap">' + ic('calendar-days') +
      '<p class="cred">' + txt + '</p></div></div>';
  };

  /* LP02 · Cabeçalho Mínimo: logotipo de produto branco, sem menu */
  C.LP02 = function () {
    var logo;
    if (LP.logo === 'talks') {
      logo = '<div class="coassina"><img src="assets/brand/svg/void-horizontal-branco.svg" width="184" height="28" alt="The VOID Tattoo"><span class="fio-v" aria-hidden="true"></span><span>TALKS</span></div>';
    } else {
      var m = { start: [3620, 579, 'The VOID Start'], master: [3894, 579, 'The VOID Master'], pro: [3745, 578, 'The VOID Pro'], horizontal: [3804, 579, 'The VOID Tattoo'] }[LP.logo];
      logo = '<img src="assets/brand/svg/void-' + LP.logo + '-branco.svg" width="' + Math.round(28 * m[0] / m[1]) + '" height="28" alt="' + m[2] + '">';
    }
    return '<header class="topo" data-lp="LP02" data-tipo="interface"><div class="wrap">' + logo +
      '<p class="cred ficha-tec">The VOID Tattoo Academy · São Paulo · Brazil</p></div></header>' +
      (LP.chave === 'talks' ? '<div class="letreiro-corrido" data-tipo="interface" data-vforms=\'{"forma":"rodape","variante":"corrido"}\'></div>' : '');
  };

  /* LP03 · Plano de Abertura */
  C.LP03 = function () {
    var h = LP.hero, temFoto = !!h.foto;
    var selo = LP.produto ? '<div class="hero-selo">' + vf({ forma: 'selo', produto: LP.produto, tamanho: 200, aria: 'Selo The VOID ' + LP.nomeCurto }) + '</div>' : '';
    var detalhes = h.detalhes ? '<ul class="hero-detalhes">' + h.detalhes.map(function (d) {
      return '<li>' + ic(d[0]) + '<span><b>' + esc(d[1]) + '</b>' + t(d[2], 'hero') + '</span></li>';
    }).join('') + '</ul>' : '';
    var midia = temFoto ? '' : '<div class="hero-midia">' + fotoSlot('foto P&B do hero', h.fotoDirecao) + selo + '</div>';
    registra(h.fonte, 'LP03 hero');
    return '<section class="hero' + (temFoto ? ' com-foto' : '') + '" id="lp03" data-lp="LP03" data-tipo="cena">' +
      (temFoto ? '<div class="hero-fundo"><img src="' + esc(h.foto) + '" alt="' + esc(h.fotoAlt) + '" width="1920" height="1080" fetchpriority="high"></div>' : '') +
      '<div class="wrap"><div class="hero-grade"><div class="hero-texto">' + marcador(h.marcador) +
      '<h1 class="h-filme" id="titulo-hero"' + (h.excecaoL6 ? ' data-excecao-l6="' + esc(h.excecaoL6) + '"' : '') + '>' + t(h.titulo) + '</h1>' +
      '<p class="hero-apoio">' + t(h.apoio, 'hero') + '</p>' + detalhes + cta('hero') + provaHero() + '</div>' +
      (temFoto ? '' : midia) + '</div></div>' + (temFoto ? selo : '') + '</section>';
  };

  /* linha curta de prova sob o botão do hero: a primeira prova marcada com "hero", com valor e origem.
     Publicada (?modo=publicacao ou HTML estático), só sai completa; no modelo, sai com a pendência à vista. */
  function provaHero() {
    var p = (LP.provas || []).filter(function (x) { return x.hero && x.valor && x.origem !== 'em-validacao'; })[0];
    if (!p) return '';
    if (PUBLICACAO && (PEND.test(p.regua) || PEND.test(p.hero))) return '';
    return '<p class="hero-prova" data-origem="' + esc(p.origem) + '"><b>' + esc(p.valor) + '</b> ' + t(p.hero, 'prova do hero') + '</p>';
  }

  /* LP04 · Cartela do Vazio */
  C.LP04 = function () {
    var v = LP.vazio;
    return secao('lp04', 'cartela', 'cartela vazio',
      marcador(v.sobre) + '<ul class="vazio-linhas">' + v.linhas.map(function (l) { return '<li>' + t(l) + '</li>'; }).join('') + '</ul>' +
      '<h2 class="h-filme">' + t(v.titulo) + '</h2>' + fonte(v.fonte, 'LP04'));
  };

  /* LP05 · Virada */
  C.LP05 = function () {
    var v = LP.virada;
    return secao('lp05', 'cartela', 'cartela virada bastidor',
      marcador('A virada') + '<p class="virada-crenca"><span class="sr">Crença falsa: </span>' + t(v.crenca) + '</p>' +
      '<h2 class="h-filme">' + t(v.titulo) + '</h2><p class="corpo">' + t(v.texto) + '</p>');
  };

  /* LP06 · Rolo de Depoimentos */
  C.LP06 = function () {
    var d = LP.depoimentos;
    var itens = d.itens.map(function (it, i) {
      return '<figure class="depo revela"><div class="video">' + fotoSlot('vídeo vertical de depoimento ' + (i + 1), 'Vídeo 9:16 de aluno real, capa no regime Terra', 'coxia') +
        '<span class="play" aria-hidden="true">' + ic('play') + '</span></div>' +
        '<h3>Antes ' + t(it.antes, 'depoimento') + ', hoje ' + esc(it.hoje) + '</h3>' +
        '<figcaption class="legenda">' + t(FR.depoimento, 'depoimento') + '</figcaption></figure>';
    }).join('');
    return secao('lp06', 'cena', '', secHead(d.sobre, d.titulo) +
      '<div class="rolo" data-n="' + d.itens.length + '" style="--n:' + Math.min(d.itens.length, 4) + '" tabindex="0" role="region" aria-label="Depoimentos em vídeo, role para o lado">' + itens + '</div>' +
      '<p class="rolo-dica legenda">' + ic('arrow-left-right', 'ic-16') + 'Role para o lado para ver todos</p>' +
      '<p class="aviso legenda">' + ic('info') + '<span>' + esc(FR.avisoCurto) + '</span></p>');
  };

  /* LP07 · Régua de Prova: só numerais validados vão ao ar; some se não houver nenhum */
  C.LP07 = function () {
    /* no modelo, prova pendente aparece marcada; publicada, só fica a prova completa (6.16) */
    var publicar = PUBLICACAO;
    var ps = (LP.provas || []).filter(function (p) {
      var completa = p.valor && p.origem !== 'em-validacao' && !PEND.test(p.regua);
      return publicar ? completa : true;
    });
    if (!ps.length) return '';
    var html = ps.map(function (p) {
      var bloq = p.origem === 'em-validacao' || PEND.test(p.regua) || !p.valor;
      var n = p.origem === 'em-validacao' ? 'dado em validação' : esc(p.valor);
      if (bloq) pendencias.push({ onde: 'prova', texto: p.oQue + ': ' + (p.origem === 'em-validacao' ? 'em validação' : p.regua) });
      return '<figure class="prova" data-origem="' + p.origem + '"><data class="prova-n" value="' + esc(p.valor || '') + '">' + n + '</data>' +
        '<figcaption class="prova-o-que">' + t(p.oQue) + '</figcaption>' +
        '<p class="prova-regua"><span class="origem" aria-hidden="true"></span>' + t(p.regua, 'crédito de prova') + '</p>' +
        (bloq ? '<p class="bloqueio">' + ic('triangle-alert') + '<span><b>Atenção:</b> bloqueia a publicação até ser validado.</span></p>' : '') + '</figure>';
    }).join('');
    return secao('lp07', 'documento', 'borda', secHead('Prova', 'Números com *fonte*.', 'Cada número traz o que mede, o recorte, a data e de onde veio. Sem isso, ele não aparece.') +
      '<div class="provas" style="--n:' + Math.min(ps.length, 4) + '">' + html + '</div>' +
      '<p class="legenda fonte">Marca de origem: fio cheio, medido pela escola; tracejado, declarado por terceiro; pontilhado, estudo de mercado.</p>');
  };

  /* LP08 · Método ARTE e Mapa da Trilha */
  C.LP08 = function () {
    var m = LP.metodo;
    var pil = [
      ['artista', 'AR', 'Artista', 'Identidade e autoralidade', 'A sua identidade visual: o que faz alguém reconhecer o seu trabalho de longe.'],
      ['tatuador', 'T', 'Tatuador', 'Técnica e experiência', 'A técnica que sustenta: traço limpo, biossegurança e domínio do equipamento.'],
      ['empreendedor', 'E', 'Empreendedor', 'Carreira e financeiro', 'A carreira em construção: portfólio, preço, cliente e números.']
    ];
    var ativa = LP.produto || null;
    return secao('lp08', 'documento', 'borda', secHead('Método ARTE', m.titulo, m.apoio) +
      '<div class="mapa">' + vf({ forma: 'mapa-trilha', ativa: ativa, voceEstaAqui: !!ativa }) + '</div>' +
      '<p class="corpo leitura" style="margin-bottom:var(--e-7)">O Método ARTE é a metodologia da The VOID. A sigla junta <b>Artista</b>, <b>Tatuador</b> e <b>Empreendedor</b>: os três pilares que acompanham você nas três formações.</p>' +
      '<div class="pilares">' + pil.map(function (p) {
        return '<article class="pilar revela"' + (m.foco === p[0] ? ' data-foco' : '') + '><span class="letra" aria-hidden="true">' + p[1] + '</span>' +
          '<h3>' + p[2] + '</h3><p class="cred">' + p[3] + '</p><p class="apoio">' + p[4] + '</p></article>';
      }).join('') + '</div>' + fonte(PROC.LP08, 'LP08'));
  };

  /* LP09 · Roteiro (acordeão, primeiro aberto) */
  C.LP09 = function () {
    var r = LP.roteiro;
    return secao('lp09', 'documento', '', secHead(r.sobre, r.titulo, r.apoio) +

      });
      if (!inst.length) inst = [{ '@type': 'CourseInstance', courseMode: LP.produto === 'pro' ? 'online' : 'onsite', location: LP.produto === 'pro' ? undefined : lugar }];
      curso.hasCourseInstance = inst;
      var m = /R\$\s?([\d.]+,\d{2}) à vista/.exec(LP.ficha && LP.ficha.investimento || '');
      if (m && !PEND.test(LP.ficha.investimento)) curso.offers = { '@type': 'Offer', price: m[1].replace(/\./g, '').replace(',', '.'), priceCurrency: 'BRL', category: 'Paid' };
      grafo.push(curso);
    }
    if (LP.evento) {
      var datas = (LP.eventoDatas || []).filter(function (x) { return futura(x.data); });
      datas.forEach(function (x) {
        var ev = { '@type': 'Event', name: LP.nome, startDate: x.data + (x.hora ? 'T' + x.hora : ''), eventAttendanceMode: 'https://schema.org/OfflineEventAttendanceMode', eventStatus: 'https://schema.org/EventScheduled', location: lugar, organizer: { '@id': id }, isAccessibleForFree: true, description: limpo(LP.meta.descricao) };
        if (URL_PAGINA) ev.url = URL_PAGINA;

    }

    var s = document.createElement('script'); s.type = 'application/ld+json'; s.id = 'jsonld';

    function checa(campo) {
      var el = form.querySelector('[name=' + campo + ']'); if (!el) return true;
      var v = el.value.trim(), ok = true;
      if (campo === 'nome') ok = v.length >= 2;

          '<a class="link-sec" data-pos-envio="abrir_whatsapp" href="' + esc(waLink((LP.form.obrigado && LP.form.obrigado.whatsapp) || LP.cta.mensagem || ('Oi, tentei me inscrever pela página ' + LP.nomeCurto + '.'))) + '" target="_blank" rel="noopener">' + ic('message-circle') + 'Falar no WhatsApp</a>';
        erroBox.hidden = false; erroBox.focus();

  function ics(titulo, data, hora) {

      'UID:' + LP.chave + '-' + d + '@thevoid', 'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '')];
    if (hora && /^\d{2}:\d{2}$/.test(hora)) linhas.push('DTSTART:' + d + 'T' + hora.replace(':', '') + '00');
    else linhas.push('DTSTART;VALUE=DATE:' + d);

  /* ===================== regra de largura do título (spec 4.3) ===================== */
  function ajustaUm(h, hero) {
    h.removeAttribute('data-largura'); h.style.fontSize = ''; h.style.fontVariationSettings = '';
    var movel = innerWidth <= 430;
    var lh = function () { return parseFloat(getComputedStyle(h).lineHeight) || parseFloat(getComputedStyle(h).fontSize) * .92; };
    var linhas = function () { return Math.round(h.getBoundingClientRect().height / lh()); };
    var transborda = function () {
      var w = h.clientWidth, esq = h.getBoundingClientRect().left, r = document.createRange(); r.selectNodeContents(h);
      var rs = r.getClientRects(); for (var i = 0; i < rs.length; i++) if (rs[i].right - esq > w + 1) return true;
      return h.scrollWidth > w + 1;
    };
    var botaoFora = function () { var b = document.querySelector('[data-cta="hero"]'); return hero && movel && b && b.getBoundingClientRect().bottom + scrollY > 640; };
    var ruim = function () { return (hero && linhas() > 3) || transborda() || botaoFora(); };
    if (!ruim()) return;
    /* 1. estreita a letra (112, 100, 92, 85); 2. só então reduz o tamanho, até 34 px; 3. senão, reescreva */
    var base = h.classList.contains('h-filme') ? (movel ? 100 : 112) : 100;
    var passos = [112, 100, 92, 85].filter(function (x) { return x <= base; });
    for (var i = 0; i < passos.length; i++) { h.style.fontVariationSettings = '"wdth" ' + passos[i]; h.setAttribute('data-largura', passos[i]); if (!ruim()) return; }
    var fs = parseFloat(getComputedStyle(h).fontSize), piso = h.classList.contains('h-filme') ? 34 : 26;
    while (ruim() && fs > piso) { fs -= 2; h.style.fontSize = fs + 'px'; }
    if (ruim()) console.warn('LP: o título "' + h.textContent.trim() + '" não cabe nem com largura 85 e tamanho mínimo. Reescreva (L6).');
  }
  /* estimativa antes das fontes chegarem (evita o salto de layout): largura média de um caractere
     do Archivo 800 em caixa alta, por largura do eixo, calibrada no render (em fração do corpo) */
  function preAjuste() {
    var K = { 112: .79, 100: .71, 92: .66, 85: .61 };
    Array.prototype.forEach.call(document.querySelectorAll('#lp .h-filme, #lp .h-secao'), function (h) {
      var maior = Math.max.apply(null, h.textContent.trim().split(/\s+/).map(function (w) { return w.length; }));
      var disp = h.clientWidth, fs = parseFloat(getComputedStyle(h).fontSize);
      var movel = innerWidth <= 430, base = h.classList.contains('h-filme') ? (movel ? 100 : 112) : 100;
      var passos = [112, 100, 92, 85].filter(function (x) { return x <= base; });
      for (var i = 0; i < passos.length; i++) { if (maior * fs * K[passos[i]] <= disp) break; }
      var w = passos[Math.min(i, passos.length - 1)];
      if (w !== base) { h.style.fontVariationSettings = '"wdth" ' + w; h.setAttribute('data-largura', w); }
      if (maior * fs * K[w] > disp) h.style.fontSize = Math.max(h.classList.contains('h-filme') ? 34 : 26, Math.floor(disp / (maior * K[w]))) + 'px';
    });
  }
  preAjuste();

  /* ===================== auditoria (L1, L6, L8, Modo Leitura, primeira dobra, distância entre botões) ===================== */
  function auditoria() {
    var A = {};
    /* repetições (spec 12.1, de 3 a 5): botões sempre visíveis na rolagem mais o botão de envio do formulário, que leva o mesmo rótulo.
       Não contam a Barra Fixa (repete o botão no celular) nem o botão que só aparece depois de uma interação (autoavaliação). */
    var condicional = function (a) { return !!a.closest('[data-auto-cta]'); };
    var naPagina = ctas.filter(function (a) { return a.getAttribute('data-cta') !== 'barra-fixa' && !condicional(a); });
    var envios = Array.prototype.slice.call(document.querySelectorAll('[data-cta-envio]'));
    var hrefs = {}; ctas.forEach(function (a) { hrefs[a.getAttribute('href')] = 1; });
    var rotulos = {}; ctas.concat(Array.prototype.slice.call(document.querySelectorAll('[data-cta-envio]'))).forEach(function (a) { rotulos[a.textContent.replace('Abrindo o WhatsApp...', LP.cta.rotulo).replace('Enviando...', LP.cta.rotulo).trim().toUpperCase()] = 1; });
    var outros = Array.prototype.filter.call(document.querySelectorAll('#lp a[href]'), function (a) {
      return !a.hasAttribute('data-cta') && !/privacidade/i.test(a.textContent) && a.getAttribute('href').charAt(0) !== '#';
    });
    var rep = naPagina.length + envios.length;
    A.L1 = { destinos: Object.keys(hrefs), rotulos: Object.keys(rotulos), repeticoes: rep, condicionais: ctas.filter(condicional).length, outrosLinks: outros.length, ok: Object.keys(hrefs).length === 1 && Object.keys(rotulos).length === 1 && outros.length === 0 && rep >= 3 && rep <= 5 };
    /* maior trecho da página sem nenhuma saída, em telas. No celular a Barra Fixa cobre a rolagem; no computador, até 5 telas */
    var ys = naPagina.concat(envios).filter(function (a) { return a.offsetParent; })
      .map(function (a) { return a.getBoundingClientRect().top + scrollY; }).sort(function (a, b) { return a - b; });
    var maior = 0; for (var k = 1; k < ys.length; k++) maior = Math.max(maior, ys[k] - ys[k - 1]);
    var bf = document.querySelector('.barra-fixa'), barraAtiva = !!bf && getComputedStyle(bf).display !== 'none';
    A.distancia = { maiorTrecho: Math.round(maior), telas: Math.round(maior / innerHeight * 10) / 10, barraFixa: barraAtiva, ok: barraAtiva || maior / innerHeight <= 5 };
    var tits = Array.prototype.map.call(document.querySelectorAll('#lp .h-filme, #lp .h-secao'), function (h) { return { t: h.textContent.trim(), n: h.textContent.trim().split(/\s+/).length, excecao: h.getAttribute('data-excecao-l6') }; });
    A.L6 = { titulos: tits, excecoes: tits.filter(function (x) { return x.n > 6 && x.excecao; }), ok: tits.every(function (x) { return x.n <= 6 || !!x.excecao; }) };
    var tipos = Array.prototype.map.call(document.querySelectorAll('main > [data-tipo]'), function (s) { return s.getAttribute('data-tipo'); }).filter(function (x) { return x !== 'interface'; });
    var tres = false; for (var i = 2; i < tipos.length; i++) if (tipos[i] === tipos[i - 1] && tipos[i] === tipos[i - 2]) tres = true;
    A.L8 = { sequencia: tipos, secoes: tipos.length, ok: !tres };
    var total = document.documentElement.scrollHeight, leit = 0, seguidas = 0, maxSeg = 0;
    Array.prototype.forEach.call(document.querySelectorAll('main > *'), function (s) {
      if (s.classList.contains('modo-leitura')) { leit += s.getBoundingClientRect().height; seguidas++; maxSeg = Math.max(maxSeg, seguidas); } else seguidas = 0;
    });
    A.modoLeitura = { percentual: Math.round(leit / total * 1000) / 10, seguidas: maxSeg, ok: leit / total <= .25 && maxSeg <= 2 };
    if (!A.modoLeitura.ok) console.warn('LP: Modo Leitura passa de 25% da altura (' + A.modoLeitura.percentual + '%) ou de 2 seções seguidas.');
    var hb = document.querySelector('[data-cta="hero"]'), ht = document.getElementById('titulo-hero'), ha = document.querySelector('.hero-apoio');
    A.primeiraDobra = { tituloFundo: Math.round(ht.getBoundingClientRect().bottom + scrollY), apoioFundo: Math.round(ha.getBoundingClientRect().bottom + scrollY), botaoFundo: Math.round(hb.getBoundingClientRect().bottom + scrollY), alturaTela: innerHeight, ok: hb.getBoundingClientRect().bottom + scrollY <= innerHeight };
    A.barraTurma = { hoje: HOJE, visivel: !!document.querySelector('.barra-turma'), inicio: (document.querySelector('.barra-turma') || { getAttribute: function () { return null; } }).getAttribute('data-inicio'), lotada: LOTADA };
    var vistos = {}; A.pendencias = pendencias.filter(function (p) { var k = p.onde + p.texto; if (vistos[k]) return false; vistos[k] = 1; return true; });
    vistos = {}; A.procedencias = procedencias.filter(function (p) { var k = p.onde + p.texto; if (vistos[k]) return false; vistos[k] = 1; return true; });
    A.jsonld = GRAFO.map(function (g) { return [].concat(g['@type']).join('+'); });
    A.travessao = /[\u2013\u2014]/.test(document.body.innerText + document.title + JSON.stringify(GRAFO));
    window.LP_AUDITORIA = A;
    return A;
  }

  /* ===================== HTML estático da variante (o que vai ao ar ou para o construtor de páginas) ===================== */
  var INTERNOS = ['fonte', 'fotoDirecao', 'excecaoL6', 'manifestoFonte', 'nota', 'persona', 'crenca', 'etapa', 'personas', 'chave'];
  function semInternos(o) {
    if (Array.isArray(o)) return o.map(semInternos);
    if (o && typeof o === 'object') { var r = {}; Object.keys(o).forEach(function (k) { if (INTERNOS.indexOf(k) < 0) r[k] = semInternos(o[k]); }); return r; }
    return o;
  }
  function json(o) { return JSON.stringify(o).replace(/</g, '\\u003c'); }
  function htmlEstatico(A) {
    var doc = document.documentElement.cloneNode(true);
    var q = function (sel) { return Array.prototype.slice.call(doc.querySelectorAll(sel)); };
    q('.painel, [data-procedencia]').forEach(function (n) { n.remove(); });
    var lp = doc.querySelector('#lp'); lp.setAttribute('data-estatico', chave);
    if (PERSONA) lp.setAttribute('data-persona', PERSONA);
    q('.revela').forEach(function (n) { n.classList.remove('vista'); });
    q('.h-filme, .h-secao, .tagline').forEach(function (n) { n.removeAttribute('style'); n.removeAttribute('data-largura'); });
    q('#lp16').forEach(function (n) { n.removeAttribute('data-vforms'); n.removeAttribute('data-vforms-montado'); n.classList.remove('vf-host'); var c = n.querySelector(':scope > .vf-camada'); if (c) c.remove(); });
    q('.barra-fixa').forEach(function (n) { n.classList.remove('visivel'); n.setAttribute('aria-hidden', 'true'); var a = n.querySelector('a'); if (a) a.setAttribute('tabindex', '-1'); });
    /* só os dados desta variante, sem persona, crença, procedência nem notas do modelo */
    q('script').forEach(function (sc) {
      if (!/^\s*window\.LP_PADRAO\s*=/m.test(sc.textContent) || /MOTOR DA LP/.test(sc.textContent)) return;
      var v = {}; v[chave] = semInternos(LP);
      sc.textContent = '\nwindow.LP_PADRAO = ' + json(chave) + ';\nwindow.LP_ESCOLA = ' + json(ESC) + ';\nwindow.LP_FRASES = ' + json(FR) + ';\nwindow.LP_VARIANTES = ' + json(v) + ';\n';
    });
    /* comentários de HTML (o "como usar" do editor) não vão ao ar */
    var w = document.createTreeWalker(doc, NodeFilter.SHOW_COMMENT), mortos = [];
    while (w.nextNode()) mortos.push(w.currentNode);
    mortos.forEach(function (c) { c.remove(); });
    /* indexação só com zero pendências (spec 13.3: o que tem pendência não vai ao ar) */
    var robo = doc.querySelector('meta[name="robots"]'); if (robo) robo.setAttribute('content', A.pendencias.length ? 'noindex' : 'index, follow');
    return '<!DOCTYPE html>\n' + doc.outerHTML + '\n';
  }
  function baixar(nome, texto) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([texto], { type: 'text/html;charset=utf-8' }));
    a.download = nome; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  window.LP_HTML_ESTATICO = function () { return htmlEstatico(window.LP_AUDITORIA || auditoria()); };

  /* ===================== painel do modelo (?painel=1) ===================== */
  function painel(A) {
    if (!PAINEL) return;
    var p = document.createElement('aside'); p.className = 'painel'; p.setAttribute('aria-label', 'Painel do modelo');
    var url = function (k, v) { var u = new URLSearchParams(location.search); if (v == null) u.delete(k); else u.set(k, v); return '?' + u.toString(); };
    var ok = function (b) { return b ? '<span class="ok">ok</span>' : '<span class="ruim">revisar</span>'; };
    var personas = LP.personas ? '<div class="vars">' + ['padrão'].concat(Object.keys(LP.personas)).map(function (k) {
      var atual = (k === 'padrão' && !PERSONA) || k === PERSONA;
      return '<a href="' + url('persona', k === 'padrão' ? null : k) + '"' + (atual ? ' aria-current="page"' : '') + '>Persona ' + esc(k) + '</a>';
    }).join('') + '</div>' : '';
    var turmas = (LP.turmas || []).length ? '<p><a href="' + url('turma', Q.get('turma') === 'lotada' ? null : 'lotada') + '">' + (Q.get('turma') === 'lotada' ? 'Voltar às turmas reais' : 'Simular turmas lotadas (lista de espera)') + '</a></p>' : '';
    p.innerHTML = '<h2>Painel do modelo</h2><div class="vars">' + Object.keys(VAR).map(function (k) { return '<a href="' + url('variante', k) + '"' + (k === LP.chave ? ' aria-current="page"' : '') + '>' + VAR[k].nomeCurto + '</a>'; }).join('') + '</div>' + personas +
      '<p><b>Persona:</b> ' + esc(LP.persona) + '<br><b>Crença atacada:</b> ' + esc(LP.crenca) + '<br><b>Etapa:</b> ' + esc(LP.etapa) + '</p>' +
      '<ul><li>L1, um destino: ' + ok(A.L1.ok) + ' (' + A.L1.repeticoes + ' botões na página, de 3 a 5' + (A.L1.condicionais ? ', mais ' + A.L1.condicionais + ' depois da autoavaliação' : '') + '; ' + A.L1.destinos.length + ' destino)</li>' +
      '<li>Maior trecho sem botão: ' + A.distancia.telas + ' telas ' + ok(A.distancia.ok) + (A.distancia.barraFixa ? ' (a Barra Fixa cobre o celular)' : ' (até 5 no computador)') + '</li>' +
      '<li>L6, até 6 palavras por título: ' + ok(A.L6.ok) + (A.L6.excecoes.length ? ' (exceção: ' + esc(A.L6.excecoes.map(function (x) { return x.excecao; }).join(', ')) + ')' : '') + '</li><li>L8, ritmo: ' + ok(A.L8.ok) + ' (' + A.L8.secoes + ' seções)</li>' +
      '<li>Modo Leitura: ' + A.modoLeitura.percentual + '% ' + ok(A.modoLeitura.ok) + '</li><li>Primeira dobra: ' + ok(A.primeiraDobra.ok) + '</li>' +
      '<li>Barra de Turma: ' + (A.barraTurma.visivel ? 'visível, turma de ' + dmy(A.barraTurma.inicio) + (LOTADA ? ', lotada' : '') : 'oculta') + ' (hoje = ' + dmy(HOJE) + ')</li>' +
      '<li>JSON-LD: ' + A.jsonld.join(', ') + '</li></ul>' + turmas +
      '<label>Simular a data de hoje<input type="date" value="' + HOJE + '" id="painel-hoje"></label>' +
      '<p class="' + (A.pendencias.length ? 'alerta' : 'ok') + '"><b>' + A.pendencias.length + ' pendências antes de publicar</b></p><ul>' +
      A.pendencias.map(function (x) { return '<li>' + esc(x.onde) + ': ' + esc(x.texto) + '</li>'; }).join('') + '</ul>' +
      '<p><b>Procedência dos textos</b> (só aqui, nunca na página)</p><ul>' + A.procedencias.map(function (x) { return '<li>' + esc(x.onde) + ': ' + esc(x.texto) + '</li>'; }).join('') + '</ul>' +
      '<p><b>Publicar</b>: baixe o HTML estático desta variante. ' + (SIMULACAO ? '<span class="alerta">Tire ?hoje e ?turma do endereço antes de exportar.</span>' : 'Com pendências, ele sai com noindex.') + '</p>' +
      '<button type="button" class="botao" id="painel-exportar"' + (SIMULACAO ? ' disabled' : '') + '><span>Baixar HTML estático</span></button>';
    document.body.appendChild(p);
    p.querySelector('#painel-hoje').addEventListener('change', function (e) { var u = new URLSearchParams(location.search); u.set('hoje', e.target.value); location.search = u.toString(); });
    p.querySelector('#painel-exportar').addEventListener('click', function () {
      if (SIMULACAO) return;
      baixar('lp-' + chave + (PERSONA ? '-' + PERSONA : '') + '.html', htmlEstatico(A));
    });
  }

  function fim() { ajustaTitulo(); var A = auditoria(); painel(A); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fim); else window.addEventListener('load', fim);
  /* a folha de fontes entra depois (media=print até carregar): fonts.ready pode resolver com a fonte reserva.
     Quando o Archivo chega, a regra de largura roda de novo, para nenhum título passar da tela */
  if (document.fonts && document.fonts.addEventListener) {
    var tf; document.fonts.addEventListener('loadingdone', function () { clearTimeout(tf); tf = setTimeout(function () { ajustaTitulo(); auditoria(); }, 60); });
  }
  var tr; addEventListener('resize', function () { clearTimeout(tr); tr = setTimeout(ajustaTitulo, 120); });
})();
</script>
<!-- motores da casa: carregam depois da montagem, para o texto aparecer sem esperar por eles -->
<script src="vforms.js"></script>
<script src="vviz.js"></script>
